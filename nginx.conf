worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Only the clean production hostname is indexable.
    # Tagged Cloud Run canaries, localhost and ANY query-string URL are noindex.
    #
    # This protects private/query routes without putting any private trigger
    # name or value into robots.txt or this configuration.
    map "$host:$args" $robots_header {
        ~^orbidense\.com:$      "index, follow";
        ~^www\.orbidense\.com:$ "index, follow";
        default                 "noindex, follow";
    }

    server {
        listen 8080;
        server_name _;

        root /app/seo;

        add_header X-Robots-Tag $robots_header always;

        location = /robots.txt {
            default_type text/plain;
            try_files /robots.txt =404;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Robots-Tag "noindex" always;
        }

        location = /sitemap.xml {
            default_type application/xml;
            try_files /sitemap.xml =404;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Robots-Tag "noindex" always;
        }

        location = /site.css {
            default_type text/css;
            try_files /site.css =404;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /about {
            default_type text/html;
            try_files /about.html =404;
        }

        location = /research {
            default_type text/html;
            try_files /research.html =404;
        }

        location = /methodology {
            default_type text/html;
            try_files /methodology.html =404;
        }

        location = /data {
            default_type text/html;
            try_files /data.html =404;
        }

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }
    }
}
